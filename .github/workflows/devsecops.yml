name: DevSecOps CI/CD Pipeline
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  devsecops:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      RUN_TAG: ci-${{ github.run_number }}
    steps:
      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # 2. Setup Node
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # =========================
      # 3. Create .env files (CI)
      # =========================
      - name: Create env files for Docker Compose
        run: |
          cp backend/users-service/.env.example  backend/users-service/.env
          cp backend/academic-service/.env.example backend/academic-service/.env
          cp backend/api-gateway/.env.example     backend/api-gateway/.env
          cp frontend/.env.example                frontend/.env

      # =========================
      # 4. Install, Lint & Test (Quality Gate)
      # =========================
      - name: Install, Lint & Test users-service
        run: |
          cd backend/users-service
          npm ci
          npm run lint
          npm test

      - name: Install, Lint & Test academic-service
        run: |
          cd backend/academic-service
          npm ci
          npm run lint
          npm test

      - name: Install, Lint & Test api-gateway
        run: |
          cd backend/api-gateway
          npm ci
          npm run lint
          npm test

      - name: Install, Lint & Test frontend
        run: |
          cd frontend
          npm ci
          npm run lint
          npm test

      # =========================
      # 5. SCA - npm audit (Gate)
      # =========================
      - name: SCA npm audit users-service
        run: |
          cd backend/users-service
          npm audit --audit-level=critical

      - name: SCA npm audit academic-service
        run: |
          cd backend/academic-service
          npm audit --audit-level=critical

      - name: SCA npm audit api-gateway
        run: |
          cd backend/api-gateway
          npm audit --audit-level=critical

      - name: SCA npm audit frontend
        run: |
          cd frontend
          npm audit --audit-level=critical

      # =========================
      # 6. SAST - Semgrep (Gate)
      # =========================
      - name: Install Semgrep
        run: |
          python3 -m pip install --upgrade pip
          pip install semgrep

      - name: SAST users-service
        run: |
          cd backend/users-service
          semgrep --config=auto --severity=ERROR

      - name: SAST academic-service
        run: |
          cd backend/academic-service
          semgrep --config=auto --severity=ERROR

      - name: SAST api-gateway
        run: |
          cd backend/api-gateway
          semgrep --config=auto --severity=ERROR

      - name: SAST frontend
        run: |
          cd frontend
          semgrep --config=auto --severity=ERROR

      # =========================
      # 7. Docker Build + Versioned Tags
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose -f backend/docker-compose.yml build

      - name: Tag Docker images with run number
        run: |
          for image in users-service academic-service api-gateway frontend; do
            docker tag ${image}:${IMAGE_TAG} ${image}:${RUN_TAG}
          done

      # =========================
      # 8. Container Scanning - Trivy
      # =========================
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: .trivycache
          key: ${{ runner.os }}-trivy-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trivy-

      - name: Trivy scan users-service
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: users-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: 1
          cache-dir: .trivycache

      - name: Trivy scan academic-service
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: academic-service:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: 1
          cache-dir: .trivycache

      - name: Trivy scan api-gateway
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: api-gateway:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: 1
          cache-dir: .trivycache

      - name: Trivy scan frontend
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: frontend:${{ env.IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: 1
          cache-dir: .trivycache

      # =========================
      # 9. Smoke tests
      # =========================
      - name: Run docker-compose
        run: |
          docker compose -f backend/docker-compose.yml up -d

      - name: Wait for API Gateway health
        run: |
          set -e
          for i in {1..20}; do
            if curl -sf http://localhost:3000/health | grep -q "api-gateway OK"; then
              echo "API Gateway OK"
              exit 0
            fi
            echo "Waiting for API Gateway... ($i/20)"
            sleep 3
          done
          echo "API Gateway failed health check"
          docker compose -f backend/docker-compose.yml logs --no-color
          exit 1

      - name: Smoke test - Login (users-service via gateway)
        run: |
          RESPONSE=$(curl -sf -X POST http://localhost:3000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@test.cl","password":"123456"}')
          echo "$RESPONSE" | grep -q "token"
          echo "Login OK - JWT received"

      - name: Smoke test - Courses (academic-service via gateway)
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:3000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@test.cl","password":"123456"}' \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          curl -sf http://localhost:3000/courses \
            -H "Authorization: Bearer $TOKEN" | grep -q "DevSecOps"
          echo "Courses OK"

      - name: Shutdown services
        if: always()
        run: docker compose -f backend/docker-compose.yml down || true
