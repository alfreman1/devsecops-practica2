name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  devsecops:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: "20"
      PYTHON_VERSION: "3.11"
      COMPOSE_FILE: backend/docker-compose.yml
      GATEWAY_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create env files for Docker Compose
        run: |
          cp backend/users-service/.env.example backend/users-service/.env
          cp backend/academic-service/.env.example backend/academic-service/.env
          cp backend/api-gateway/.env.example backend/api-gateway/.env
          cp frontend/.env.example frontend/.env

      # =========================
      # Install (reproducible)
      # =========================
      - name: Install users-service
        run: |
          cd backend/users-service
          npm ci

      - name: Install academic-service
        run: |
          cd backend/academic-service
          npm ci

      - name: Install api-gateway
        run: |
          cd backend/api-gateway
          npm ci

      - name: Install frontend
        run: |
          cd frontend
          npm ci

      # =========================
      # Code quality
      # =========================
      - name: Lint users-service
        run: |
          cd backend/users-service
          npm run lint

      - name: Lint academic-service
        run: |
          cd backend/academic-service
          npm run lint

      - name: Lint api-gateway
        run: |
          cd backend/api-gateway
          npm run lint

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      # =========================
      # Tests
      # =========================
      - name: Test users-service
        run: |
          cd backend/users-service
          npm test

      - name: Test academic-service
        run: |
          cd backend/academic-service
          npm test

      - name: Test api-gateway
        run: |
          cd backend/api-gateway
          npm test

      - name: Test frontend
        env:
          CI: true
        run: |
          cd frontend
          npm test

      # =========================
      # SAST - Semgrep
      # =========================
      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: SAST scan (Semgrep)
        run: |
          semgrep --config=auto --severity=ERROR

      # =========================
      # SCA
      # =========================
      - name: SCA frontend (npm audit)
        run: |
          cd frontend
          npm audit --audit-level=critical

      - name: SCA backend (pip-audit if requirements.txt exists)
        run: |
          python -m pip install pip-audit
          if [ -n "$(find . -name 'requirements*.txt' -print -quit)" ]; then
            pip-audit --severity critical
          else
            echo "No requirements.txt found. Skipping pip-audit."
          fi

      # =========================
      # Docker build + versioning
      # =========================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} build --no-cache

      - name: Tag Docker images
        run: |
          for img in users-service academic-service api-gateway frontend; do
            docker tag ${img}:latest ${img}:${{ github.sha }}
            docker tag ${img}:latest ${img}:${{ github.run_number }}
          done

      # =========================
      # Container scanning (Trivy)
      # =========================
      # - name: Trivy scan users-service
      #   uses: aquasecurity/trivy-action@0.20.0
      #   with:
      #     image-ref: users-service:${{ github.sha }}
      #     severity: HIGH,CRITICAL
      #     exit-code: 1
      #     timeout: 10m
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      #     TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

      # - name: Trivy scan academic-service
      #   uses: aquasecurity/trivy-action@0.20.0
      #   with:
      #     image-ref: academic-service:${{ github.sha }}
      #     severity: HIGH,CRITICAL
      #     exit-code: 1
      #     timeout: 10m
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      #     TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

      # - name: Trivy scan api-gateway
      #   uses: aquasecurity/trivy-action@0.20.0
      #   with:
      #     image-ref: api-gateway:${{ github.sha }}
      #     severity: HIGH,CRITICAL
      #     exit-code: 1
      #     timeout: 10m
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      #     TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

      # - name: Trivy scan frontend
      #   uses: aquasecurity/trivy-action@0.20.0
      #   with:
      #     image-ref: frontend:${{ github.sha }}
      #     severity: HIGH,CRITICAL
      #     exit-code: 1
      #     timeout: 10m
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
      #     TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db

      # # =========================
      # # Run stack + smoke tests
      # =========================
      - name: Run docker compose stack
        run: |
          docker compose -f ${{ env.COMPOSE_FILE }} up -d

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS ${{ env.GATEWAY_URL }}/health > /dev/null; then
              echo "Gateway is healthy"
              exit 0
            fi
            sleep 3
          done
          echo "Gateway health check failed"
          exit 1

      - name: Smoke test protected endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.GATEWAY_URL }}/courses)
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "Expected 401/403 but got $STATUS"
            exit 1
          fi

      # =========================
      # DAST - OWASP ZAP baseline
      # =========================
      - name: ZAP baseline scan
        run: |
          mkdir -p zap
          chmod 777 zap
          docker run --rm \
            --user 0 \
            --add-host=host.docker.internal:host-gateway \
            -v ${{ github.workspace }}/zap:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://host.docker.internal:3000 -m 3 -a \
            -J zap_report.json -r zap_report.html \
            -c zap-baseline.conf

      - name: ZAP gate (fail on HIGH)
        run: |
          python - <<'PY'
          import json, sys
          with open("zap/zap_report.json", "r", encoding="utf-8") as f:
            data = json.load(f)
          alerts = data.get("site", [{}])[0].get("alerts", [])
          high = [a for a in alerts if a.get("riskcode") == "3"]
          if high:
            print(f"ZAP HIGH alerts found: {len(high)}")
            for a in high:
              print(f"- {a.get('alert')} ({a.get('riskdesc')})")
            sys.exit(1)
          print("No ZAP HIGH alerts found")
          PY

      - name: Shutdown services
        if: always()
        run: docker compose -f ${{ env.COMPOSE_FILE }} down || true
